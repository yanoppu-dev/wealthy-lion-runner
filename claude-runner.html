<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ウェイッ！小金持ちランナー</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #e6edf3;
      user-select: none;
    }
    h1 { font-size: 1.4rem; margin-bottom: 12px; color: #f0883e; letter-spacing: 2px; }
    #gameCanvas { border: 2px solid #30363d; border-radius: 8px; display: block; background: #161b22; cursor: pointer; }
    #ui { margin-top: 12px; display: flex; gap: 28px; font-size: 0.85rem; color: #8b949e; }
    #ui span { color: #58a6ff; font-weight: bold; }
    #coinCount { color: #f0883e !important; }
    #message { margin-top: 10px; font-size: 0.8rem; color: #3fb950; min-height: 18px; transition: color 0.3s; }
  </style>
</head>
<body>
  <h1>💰 ウェイッ！小金持ちランナー 💰</h1>
  <canvas id="gameCanvas" width="720" height="220"></canvas>
  <div id="ui">
    スコア: <span id="score">0</span>
    &nbsp;ハイスコア: <span id="hi">0</span>
    &nbsp;コイン: <span id="coinCount">0</span>
    &nbsp;レベル: <span id="level">1</span>
  </div>
  <div id="message">[ SPACE ] / タップ でスタート &nbsp;|&nbsp; 二段ジャンプOK</div>

<script>
// ── Canvas setup ───────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const GROUND = H - 50;

// ── Audio (Web Audio API) ──────────────────────────────
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function beep(freq, type, duration, vol = 0.15, startTime = 0) {
  try {
    const ac = getAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ac.currentTime + startTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + startTime + duration);
    osc.start(ac.currentTime + startTime);
    osc.stop(ac.currentTime + startTime + duration);
  } catch(e) {}
}
function sfxJump()   { beep(300, 'sine', 0.12); beep(450, 'sine', 0.1, 0.1, 0.05); }
function sfxCoin()   { beep(880, 'sine', 0.08); beep(1100, 'sine', 0.08, 0.1, 0.06); }
function sfxShield() { beep(440, 'triangle', 0.06); beep(660, 'triangle', 0.1, 0.12, 0.05); beep(880, 'triangle', 0.15, 0.1, 0.1); }
function sfxHit()    { beep(180, 'sawtooth', 0.08, 0.2); beep(100, 'sawtooth', 0.18, 0.15, 0.07); }
function sfxLand()   { beep(200, 'sine', 0.06, 0.08); }

// ── State ──────────────────────────────────────────────
let state = 'idle';
let score = 0, coins = 0, hiScore = +localStorage.getItem('cc_hi') || 0;
let frame = 0, speed = 5;
let obstacles = [], pickups = [], particles = [], floatTexts = [];
let shieldActive = false, shieldTimer = 0;
let flashMsg = '', flashTimer = 0;

document.getElementById('hi').textContent = hiScore;

// ── Claude character ───────────────────────────────────
const claude = {
  x: 90, y: GROUND, w: 36, h: 42,
  vy: 0, onGround: true, jumpCount: 0, legPhase: 0,
  squash: 1, squashV: 0,
  jump() {
    if (this.jumpCount < 2) {
      this.vy = -14;
      this.onGround = false;
      this.jumpCount++;
      this.squash = 0.7; this.squashV = 0.06;
      spawnParticles(this.x + this.w / 2, this.y + this.h, '#f0883e', 7);
      sfxJump();
    }
  },
  update() {
    // Squash & stretch
    if (this.squash !== 1) {
      this.squash += this.squashV;
      if (this.squash >= 1) { this.squash = 1; this.squashV = 0; }
    }
    if (!this.onGround) {
      this.vy += 0.65;
      this.y += this.vy;
    }
    if (this.y >= GROUND) {
      if (!this.onGround) {
        this.squash = 1.3; this.squashV = -0.08;
        sfxLand();
      }
      this.y = GROUND; this.vy = 0;
      this.onGround = true; this.jumpCount = 0;
    }
    if (state === 'running') this.legPhase += 0.28;
  },
  draw() {
    const cx    = this.x + this.w / 2;
    const sy    = this.squash;
    const sx    = 1 + (1 - sy) * 0.5;
    // pin character to bottom so squash looks like landing
    const baseY = this.y + this.h;          // feet position (constant)
    const R     = 13;                        // head radius (unsquashed)
    const headCY = baseY - 28 * sy;         // head centre, rises when stretched
    const headRY = R * sy;
    const headRX = R * sx;

    const maneColor  = shieldActive ? '#58a6ff' : '#c8782a';
    const faceColor  = shieldActive ? '#79c0ff' : '#f0b060';
    const lightColor = shieldActive ? '#b3d9ff' : '#ffd080';
    const darkColor  = shieldActive ? '#1f4080' : '#7a4010';

    // ── Shield glow ────────────────────────────────────
    if (shieldActive) {
      ctx.save();
      ctx.globalAlpha = 0.22 + Math.sin(frame * 0.2) * 0.08;
      ctx.fillStyle = '#58a6ff';
      ctx.beginPath();
      ctx.ellipse(cx, headCY, headRX + 16, headRY + 16, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // ── Shadow ────────────────────────────────────────
    ctx.save();
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(cx, baseY + 4, 15 * sx, 3.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // ── Mane (spiky ring behind head) ─────────────────
    const maneR = headRX * 1.55;
    const maneSpikes = 14;
    ctx.fillStyle = maneColor;
    ctx.beginPath();
    for (let i = 0; i < maneSpikes; i++) {
      const a0 = (i / maneSpikes) * Math.PI * 2 - Math.PI / 2;
      const a1 = ((i + 0.5) / maneSpikes) * Math.PI * 2 - Math.PI / 2;
      const a2 = ((i + 1) / maneSpikes) * Math.PI * 2 - Math.PI / 2;
      const innerR = headRX * 1.1;
      const outerR = maneR * (0.88 + Math.sin(i * 2.3) * 0.12);
      if (i === 0) ctx.moveTo(cx + Math.cos(a0) * innerR * sx, headCY + Math.sin(a0) * innerR * sy);
      else         ctx.lineTo(cx + Math.cos(a0) * innerR * sx, headCY + Math.sin(a0) * innerR * sy);
      ctx.lineTo(cx + Math.cos(a1) * outerR * sx, headCY + Math.sin(a1) * outerR * sy);
      ctx.lineTo(cx + Math.cos(a2) * innerR * sx, headCY + Math.sin(a2) * innerR * sy);
    }
    ctx.closePath();
    ctx.fill();

    // ── Ears (triangles above mane) ───────────────────
    ctx.fillStyle = faceColor;
    ctx.strokeStyle = maneColor;
    ctx.lineWidth = 1.5;
    [[-1], [1]].forEach(([dir]) => {
      const ex = cx + dir * headRX * 0.52 * sx;
      const ey = headCY - headRY * 0.88 * sy;
      ctx.beginPath();
      ctx.moveTo(ex - 5 * sx, ey + 4 * sy);
      ctx.lineTo(ex + 5 * sx, ey + 4 * sy);
      ctx.lineTo(ex, ey - 9 * sy);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // inner ear
      ctx.fillStyle = '#e07050';
      ctx.beginPath();
      ctx.moveTo(ex - 2.5 * sx, ey + 2 * sy);
      ctx.lineTo(ex + 2.5 * sx, ey + 2 * sy);
      ctx.lineTo(ex, ey - 5 * sy);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = faceColor;
    });

    // ── Face (round) ──────────────────────────────────
    ctx.fillStyle   = faceColor;
    ctx.strokeStyle = maneColor;
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.ellipse(cx, headCY, headRX * sx, headRY * sy, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // ── Eyes ──────────────────────────────────────────
    const eyeY = headCY - headRY * 0.15;
    ctx.fillStyle = '#3a2000';
    ctx.beginPath(); ctx.ellipse(cx - headRX * 0.3 * sx, eyeY, 3 * sx, 3.5 * sy, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + headRX * 0.3 * sx, eyeY, 3 * sx, 3.5 * sy, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.ellipse(cx - headRX * 0.3 * sx - 1, eyeY - 1, 1, 1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + headRX * 0.3 * sx - 1, eyeY - 1, 1, 1, 0, 0, Math.PI * 2); ctx.fill();

    // ── Nose ──────────────────────────────────────────
    ctx.fillStyle = '#c05030';
    ctx.beginPath();
    ctx.moveTo(cx, headCY + headRY * 0.12 * sy);
    ctx.lineTo(cx - 3 * sx, headCY + headRY * 0.28 * sy);
    ctx.lineTo(cx + 3 * sx, headCY + headRY * 0.28 * sy);
    ctx.closePath(); ctx.fill();

    // ── Whiskers ──────────────────────────────────────
    ctx.strokeStyle = 'rgba(60,30,0,0.4)';
    ctx.lineWidth = 1; ctx.lineCap = 'round';
    [[-1],[1]].forEach(([dir]) => {
      const wx = cx + dir * headRX * 0.15 * sx;
      const wy = headCY + headRY * 0.28 * sy;
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(wx + dir * headRX * 0.8 * sx, wy - 1.5 * sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(wx, wy + 2 * sy); ctx.lineTo(wx + dir * headRX * 0.8 * sx, wy + 2 * sy); ctx.stroke();
    });

    // ── Mouth ─────────────────────────────────────────
    ctx.strokeStyle = '#7a3010';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, headCY + headRY * 0.38 * sy, headRX * 0.22 * sx, 0.15, Math.PI - 0.15);
    ctx.stroke();

    // ── Body ──────────────────────────────────────────
    const torsoTop = headCY + headRY * sy - 4;
    const torsoH   = 8 * sy;
    const torsoW   = 18 * sx;
    ctx.fillStyle   = maneColor;
    ctx.strokeStyle = darkColor;
    ctx.lineWidth   = 1.5;
    roundRect(ctx, cx - torsoW / 2, torsoTop, torsoW, torsoH, 3, true, true);

    // ── Legs ──────────────────────────────────────────
    ctx.strokeStyle = maneColor;
    ctx.lineWidth   = 3.5;
    ctx.lineCap     = 'round';
    const legOff = Math.sin(this.legPhase) * 6;
    const legTop = torsoTop + torsoH - 2;
    ctx.beginPath(); ctx.moveTo(cx - 5, legTop); ctx.lineTo(cx - 5, baseY + legOff);  ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 5, legTop); ctx.lineTo(cx + 5, baseY - legOff); ctx.stroke();
    // Paws
    ctx.fillStyle = faceColor;
    ctx.beginPath(); ctx.ellipse(cx - 5, baseY + legOff,  4 * sx, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 5, baseY - legOff, 4 * sx, 3, 0, 0, Math.PI * 2); ctx.fill();
  },
  rect() { return { x: this.x + 5, y: this.y + 5, w: this.w - 10, h: this.h - 5 }; }
};

// ── Obstacles ──────────────────────────────────────────
const BUG_TYPES = [
  { label: 'small', color: '#7a2d8c', w: 34, h: 36, size: 'small' },
  { label: 'tall',  color: '#5a1a7a', w: 28, h: 50, size: 'tall'  },
  { label: 'wide',  color: '#9b1fad', w: 44, h: 30, size: 'wide'  },
  { label: 'big',   color: '#6b0f9c', w: 40, h: 44, size: 'big'   },
];

function spawnObstacle() {
  // Sometimes spawn a pair
  const t = BUG_TYPES[Math.floor(Math.random() * BUG_TYPES.length)];
  obstacles.push({ x: W + 10, y: GROUND + (42 - t.h), w: t.w, h: t.h, label: t.label, color: t.color, emoji: t.emoji });
  if (score > 600 && Math.random() < 0.25) {
    const t2 = BUG_TYPES[Math.floor(Math.random() * BUG_TYPES.length)];
    obstacles.push({ x: W + 10 + t.w + 12, y: GROUND + (42 - t2.h), w: t2.w, h: t2.h, label: t2.label, color: t2.color, emoji: t2.emoji });
  }
}

function drawObstacle(o) {
  const mx = o.x + o.w / 2;
  const stemH = o.h * 0.45;
  const capH  = o.h * 0.58;
  const stemW = o.w * 0.38;
  const capW  = o.w;
  const stemY = o.y + capH * 0.7;
  const capY  = o.y;

  // Stem
  ctx.fillStyle = '#f5d5b0';
  ctx.strokeStyle = '#c8a070';
  ctx.lineWidth = 1.5;
  roundRect(ctx, mx - stemW / 2, stemY, stemW, stemH, 3, true, true);
  // Stem spots
  ctx.fillStyle = 'rgba(180,130,80,0.4)';
  ctx.beginPath(); ctx.ellipse(mx - stemW * 0.1, stemY + stemH * 0.35, 2, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(mx + stemW * 0.15, stemY + stemH * 0.65, 1.5, 2, 0, 0, Math.PI * 2); ctx.fill();

  // Cap (semicircle top)
  ctx.fillStyle = o.color;
  ctx.strokeStyle = '#3a0050';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.ellipse(mx, capY + capH * 0.55, capW / 2, capH * 0.6, 0, Math.PI, Math.PI * 2);
  ctx.lineTo(mx + capW / 2, capY + capH * 0.55);
  ctx.ellipse(mx, capY + capH * 0.55, capW / 2, capH * 0.18, 0, 0, Math.PI);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // White spots on cap
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  const spots = o.w < 36
    ? [[0, -0.28, 4, 3.5], [-0.3, -0.05, 2.5, 2]]
    : [[0, -0.32, 5, 4], [-0.3, -0.1, 3, 2.5], [0.3, -0.08, 2.5, 2]];
  spots.forEach(([dx, dy, rx, ry]) => {
    ctx.beginPath();
    ctx.ellipse(mx + dx * capW, capY + capH * (0.55 + dy), rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // Eyes (menacing)
  const eyeY = capY + capH * 0.48;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(mx - capW * 0.18, eyeY, 3.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(mx + capW * 0.18, eyeY, 3.5, 3, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#200030';
  ctx.beginPath(); ctx.ellipse(mx - capW * 0.16, eyeY + 0.5, 2, 2, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(mx + capW * 0.2,  eyeY + 0.5, 2, 2, 0, 0, Math.PI * 2); ctx.fill();
  // Angry brows
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(mx - capW * 0.28, eyeY - 4); ctx.lineTo(mx - capW * 0.08, eyeY - 2.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(mx + capW * 0.08, eyeY - 2.5); ctx.lineTo(mx + capW * 0.28, eyeY - 4); ctx.stroke();
}

// ── Pickups (coins & shield) ───────────────────────────
function spawnPickup() {
  const isCoin = Math.random() < 0.75;
  const yPos = isCoin
    ? GROUND - 20 - Math.random() * 60
    : GROUND - 30 - Math.random() * 40;
  pickups.push({
    x: W + 10, y: yPos,
    type: isCoin ? 'coin' : 'shield',
    r: isCoin ? 10 : 13,
    phase: Math.random() * Math.PI * 2,
  });
}

function drawPickup(p) {
  const bob = Math.sin(frame * 0.08 + p.phase) * 3;
  const py = p.y + bob;
  if (p.type === 'coin') {
    // くるくる回るコイン（横幅をsin波で変化させて回転感を出す）
    const spin = Math.sin(frame * 0.15 + p.phase);  // -1〜1
    const coinRX = Math.abs(spin) * p.r;             // 横半径（回転で潰れる）
    const coinRY = p.r;
    const faceVisible = spin >= 0;

    // Glow
    ctx.save();
    ctx.globalAlpha = 0.2;
    ctx.fillStyle = '#f5c400';
    ctx.beginPath();
    ctx.ellipse(p.x, py, p.r + 5, p.r + 4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Coin edge (slightly darker, offset)
    if (coinRX > 1) {
      ctx.fillStyle = '#b8860b';
      ctx.beginPath();
      ctx.ellipse(p.x + 2, py, coinRX, coinRY, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Coin face
    const grad = ctx.createRadialGradient(p.x - coinRX * 0.3, py - coinRY * 0.3, 0, p.x, py, p.r);
    grad.addColorStop(0, '#ffe066');
    grad.addColorStop(0.6, '#f5c400');
    grad.addColorStop(1, '#c89a00');
    ctx.fillStyle = grad;
    ctx.strokeStyle = '#c89a00';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(p.x, py, Math.max(coinRX, 0.5), coinRY, 0, 0, Math.PI * 2);
    ctx.fill();
    if (coinRX > 1) ctx.stroke();

    // ¥ マーク（表面が見えているときだけ）
    if (faceVisible && coinRX > 3) {
      ctx.globalAlpha = coinRX / p.r;
      ctx.fillStyle = '#7a5a00';
      ctx.font = `bold ${Math.round(p.r * 0.85)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText('¥', p.x, py + p.r * 0.35);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }
  } else {
    // Shield
    ctx.save();
    ctx.globalAlpha = 0.15 + Math.sin(frame * 0.1) * 0.1;
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath();
    ctx.arc(p.x, py, p.r + 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle = '#58a6ff';
    ctx.strokeStyle = '#79c0ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(p.x, py, p.r, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = '12px serif';
    ctx.textAlign = 'center';
    ctx.fillText('🛡', p.x - 6, py + 5);
    ctx.textAlign = 'left';
  }
}

// ── Particles & float texts ────────────────────────────
function spawnParticles(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 6,
      vy: -Math.random() * 5 - 1,
      life: 35 + Math.random() * 20,
      color, r: 2 + Math.random() * 3
    });
  }
}

function addFloatText(x, y, text, color) {
  floatTexts.push({ x, y, text, color, life: 50, vy: -1.2 });
}

function updateParticles() {
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life--;
    ctx.globalAlpha = p.life / 55;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });
  floatTexts = floatTexts.filter(t => t.life > 0);
  floatTexts.forEach(t => {
    t.y += t.vy; t.life--;
    ctx.globalAlpha = t.life / 50;
    ctx.fillStyle = t.color;
    ctx.font = 'bold 13px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(t.text, t.x, t.y);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  });
}

// ── Background ─────────────────────────────────────────
let bgOffset = 0;
const STARS = Array.from({ length: 45 }, () => ({
  x: Math.random() * W, y: Math.random() * (GROUND - 20), r: Math.random() * 1.5,
  twinkle: Math.random() * Math.PI * 2
}));
const CODE_LINES = [
  'const run = () => {', 'while(true) jump();', 'git commit -m "feat"',
  'npm run build', '> claude --help', 'if (bug) dodge();',
  'await think(deep);', 'return knowledge;'
];

function drawBackground() {
  ctx.fillStyle = '#161b22';
  ctx.fillRect(0, 0, W, H);

  // Twinkling stars
  STARS.forEach(s => {
    const alpha = 0.2 + Math.sin(frame * 0.02 + s.twinkle) * 0.15;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#58a6ff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  });

  // Scrolling code
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#58a6ff';
  ctx.font = '10px Courier New';
  CODE_LINES.forEach((l, i) => {
    const xOff = ((bgOffset * 0.4 + i * 140) % (W + 220)) - 110;
    ctx.fillText(l, xOff, 28 + i * 20);
  });
  ctx.globalAlpha = 1;

  // Ground platform
  ctx.fillStyle = '#21262d';
  ctx.fillRect(0, GROUND + 42, W, H);

  // Ground top line
  ctx.strokeStyle = '#30363d';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, GROUND + 42); ctx.lineTo(W, GROUND + 42); ctx.stroke();

  // Animated dashed line
  ctx.setLineDash([10, 8]);
  ctx.strokeStyle = '#3fb950';
  ctx.lineWidth = 1;
  ctx.beginPath();
  const dash = bgOffset % 18;
  ctx.moveTo(-dash, GROUND + 43); ctx.lineTo(W, GROUND + 43);
  ctx.stroke();
  ctx.setLineDash([]);

  // Small decorative pixel floor tiles
  ctx.globalAlpha = 0.12;
  ctx.fillStyle = '#3fb950';
  for (let tx = -(bgOffset % 40); tx < W; tx += 40) {
    ctx.fillRect(tx, GROUND + 42, 38, 4);
  }
  ctx.globalAlpha = 1;
}

// ── Flash messages ─────────────────────────────────────
function setFlash(msg, color = '#3fb950') {
  document.getElementById('message').textContent = msg;
  document.getElementById('message').style.color = color;
}

// ── HUD ────────────────────────────────────────────────
function drawHUD() {
  // Score
  ctx.fillStyle = '#8b949e';
  ctx.font = '12px Courier New';
  ctx.fillText(`> ${score}pts`, 10, 18);

  // Shield status
  if (shieldActive) {
    const pct = shieldTimer / 300;
    ctx.fillStyle = '#21262d';
    ctx.fillRect(10, 24, 60, 6);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(10, 24, 60 * pct, 6);
    ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
    ctx.strokeRect(10, 24, 60, 6);
    ctx.fillStyle = '#79c0ff';
    ctx.font = '9px Courier New';
    ctx.fillText('SHIELD', 12, 22);
  }

  // Speed bar
  const barW = 70;
  const filled = Math.min((speed - 5) / 10 * barW, barW);
  ctx.fillStyle = '#21262d';
  ctx.fillRect(W - 90, 8, barW, 7);
  ctx.fillStyle = speed > 12 ? '#da3633' : speed > 9 ? '#f0883e' : '#3fb950';
  ctx.fillRect(W - 90, 8, filled, 7);
  ctx.strokeStyle = '#30363d'; ctx.lineWidth = 1;
  ctx.strokeRect(W - 90, 8, barW, 7);
  ctx.fillStyle = '#8b949e';
  ctx.font = '9px Courier New';
  ctx.fillText('SPD', W - 107, 16);
}

// ── Collision ──────────────────────────────────────────
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function circleRect(cx, cy, cr, rx, ry, rw, rh) {
  const nx = Math.max(rx, Math.min(cx, rx + rw));
  const ny = Math.max(ry, Math.min(cy, ry + rh));
  return (cx - nx) ** 2 + (cy - ny) ** 2 < cr * cr;
}

// ── Overlay screens ────────────────────────────────────
function drawOverlay(bgAlpha, lines) {
  ctx.fillStyle = `rgba(13,17,23,${bgAlpha})`;
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  lines.forEach(({ text, color, size, y }) => {
    ctx.fillStyle = color;
    ctx.font = `${size}px Courier New`;
    ctx.fillText(text, W / 2, y);
  });
  ctx.textAlign = 'left';
}

function drawIdleScreen() {
  drawOverlay(0.65, [
    { text: '💰 ウェイッ！小金持ちランナー', color: '#f5c400', size: 20, y: H/2 - 30 },
    { text: '毒キノコを避けてお金を集めよう！', color: '#3fb950', size: 14, y: H/2 },
    { text: '🛡️ シールドでバグを1回無効化', color: '#79c0ff', size: 12, y: H/2 + 22 },
    { text: '[ SPACE ] / クリック でスタート', color: '#58a6ff', size: 13, y: H/2 + 50 },
  ]);
}

function drawGameOverScreen() {
  drawOverlay(0.78, [
    { text: '💥 PROCESS TERMINATED', color: '#da3633', size: 26, y: H/2 - 28 },
    { text: `スコア: ${score}  コイン: ${coins}  Best: ${hiScore}`, color: '#8b949e', size: 13, y: H/2 + 4 },
    { text: '[ SPACE ] でリスタート', color: '#3fb950', size: 13, y: H/2 + 34 },
  ]);
}

// ── Reset ──────────────────────────────────────────────
function resetGame() {
  state = 'running';
  score = 0; coins = 0; frame = 0; speed = 5;
  obstacles = []; pickups = []; particles = []; floatTexts = [];
  shieldActive = false; shieldTimer = 0;
  claude.y = GROUND; claude.vy = 0; claude.onGround = true;
  claude.jumpCount = 0; claude.squash = 1; claude.squashV = 0;
  nextObstacle = 90; nextPickup = 60 + Math.random() * 80;
  document.getElementById('score').textContent = '0';
  document.getElementById('coinCount').textContent = '0';
  document.getElementById('level').textContent = '1';
  setFlash('毒キノコを避けろ！お金を集めろ！');
}

// ── Main loop ──────────────────────────────────────────
let nextObstacle = 90, nextPickup = 100;

function loop() {
  requestAnimationFrame(loop);
  frame++;
  bgOffset += state === 'running' ? speed * 0.5 : 0.8;

  drawBackground();
  updateParticles();

  if (state === 'running') {
    score++;
    const lvl = Math.floor(score / 400) + 1;
    speed = 5 + (lvl - 1) * 0.9;
    document.getElementById('score').textContent = score;
    document.getElementById('level').textContent = lvl;

    // Level up flash
    if (score > 0 && score % 400 === 0) {
      setFlash(`🚀 LEVEL ${lvl}！`, '#f0883e');
      spawnParticles(W / 2, H / 2, '#f0883e', 20);
    }

    // Shield timer
    if (shieldActive) {
      shieldTimer--;
      if (shieldTimer <= 0) { shieldActive = false; setFlash('シールド切れ！', '#8b949e'); }
    }

    // Spawn obstacles
    if (frame >= nextObstacle) {
      spawnObstacle();
      const minGap = Math.max(55, 130 - Math.floor(score / 300) * 6);
      nextObstacle = frame + minGap + Math.random() * 55;
    }

    // Spawn pickups
    if (frame >= nextPickup) {
      spawnPickup();
      nextPickup = frame + 80 + Math.random() * 120;
    }

    // Update & draw obstacles
    obstacles = obstacles.filter(o => o.x + o.w > -10);
    obstacles.forEach(o => {
      o.x -= speed;
      drawObstacle(o);
      if (rectsOverlap(claude.rect(), o)) {
        if (shieldActive) {
          shieldActive = false; shieldTimer = 0;
          spawnParticles(o.x + o.w / 2, o.y + o.h / 2, '#58a6ff', 18);
          addFloatText(o.x + o.w / 2, o.y - 10, 'BLOCKED!', '#58a6ff');
          setFlash('シールドがバグを防いだ！', '#58a6ff');
          sfxShield();
          o.x = -200; // remove
        } else {
          state = 'dead';
          hiScore = Math.max(hiScore, score);
          localStorage.setItem('cc_hi', hiScore);
          document.getElementById('hi').textContent = hiScore;
          spawnParticles(claude.x + claude.w / 2, claude.y + claude.h / 2, '#da3633', 22);
          spawnParticles(claude.x + claude.w / 2, claude.y + claude.h / 2, '#f0883e', 14);
          sfxHit();
        }
      }
    });

    // Update & draw pickups
    pickups = pickups.filter(p => p.x + p.r > -10);
    pickups.forEach(p => {
      p.x -= speed;
      drawPickup(p);
      const cr = claude.rect();
      if (circleRect(p.x, p.y + Math.sin(frame * 0.08 + p.phase) * 3, p.r, cr.x, cr.y, cr.w, cr.h)) {
        if (p.type === 'coin') {
          coins++;
          score += 50;
          document.getElementById('coinCount').textContent = coins;
          spawnParticles(p.x, p.y, '#f0883e', 10);
          addFloatText(p.x, p.y - 10, '+50', '#f0883e');
          sfxCoin();
        } else {
          shieldActive = true; shieldTimer = 300;
          spawnParticles(p.x, p.y, '#58a6ff', 14);
          addFloatText(p.x, p.y - 10, 'SHIELD!', '#58a6ff');
          setFlash('🛡️ シールド発動！次のバグを1回防ぐよ', '#79c0ff');
          sfxShield();
        }
        p.x = -200; // consume
      }
    });

    claude.update();
    claude.draw();
    drawHUD();

  } else if (state === 'idle') {
    claude.y = GROUND;
    claude.draw();
    drawIdleScreen();
  } else if (state === 'dead') {
    obstacles.forEach(drawObstacle);
    pickups.forEach(drawPickup);
    claude.draw();
    drawHUD();
    drawGameOverScreen();
  }
}

// ── Input ──────────────────────────────────────────────
function handleAction() {
  if (state === 'idle' || state === 'dead') {
    resetGame();
  } else {
    claude.jump();
  }
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); handleAction(); }
});
canvas.addEventListener('click', handleAction);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleAction(); });

// ── Utils ──────────────────────────────────────────────
function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  if (w < 2 * r) r = w / 2;
  if (h < 2 * r) r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

loop();
</script>
